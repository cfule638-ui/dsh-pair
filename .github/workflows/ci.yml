name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - name: Smoke test the server over stdio
        run: |
          node -e "
          const { spawn } = require('node:child_process');
          const p = spawn(process.execPath, ['src/server.mjs'], { env: { ...process.env, PAIR_AGENT: 'ci' } });
          let out = '';
          p.stdout.on('data', (d) => { out += d; });
          p.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'ci', version: '0' } } }) + '\n');
          p.stdin.write(JSON.stringify({ jsonrpc: '2.0', id: 2, method: 'tools/list' }) + '\n');
          setTimeout(() => {
            const lines = out.trim().split('\n').map((l) => JSON.parse(l));
            const names = lines.find((l) => l.id === 2).result.tools.map((t) => t.name);
            if (names.length !== 6) { console.error('expected 6 tools, got', names); process.exit(1); }
            console.log('ok:', names.join(', '));
            p.kill();
          }, 500);
          "